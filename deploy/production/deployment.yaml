apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mcp-seedance
  name: mcp-seedance
  namespace: acedatacloud
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mcp-seedance
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mcp-seedance
    spec:
      containers:
        - name: mcp-seedance
          image: ghcr.io/acedatacloud/mcp-seedance:${TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: MCP_SERVER_URL
              value: "https://seedance.mcp.acedata.cloud"
            - name: ACEDATACLOUD_OAUTH_CLIENT_ID
              value: "MvO3Wyw027hQRRTdbO4jaK6n9-6a1QFFjTGN7tHFHRs"
            - name: MCP_OAUTH_REDIS_URL
              value: "redis://mcp-acedatacloud-oauth-redis:6379/0"
            - name: MCP_OAUTH_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mcp-acedatacloud-oauth-redis
                  key: password
            - name: MCP_OAUTH_STATE_KEY
              valueFrom:
                secretKeyRef:
                  name: mcp-seedance-oauth-state
                  key: state_key
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 30m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      dnsPolicy: ClusterFirst
      imagePullSecrets:
        - name: docker-registry
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
